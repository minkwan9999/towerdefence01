# 구글 플레이용 안드로이드 앱(AAB) 빌드.
# Actions 탭 → "Android 앱 빌드" → Run workflow 에서 versionCode 를 넣고 실행하면,
# 서명된 AAB(플레이 콘솔 업로드용)와 APK(폰에 직접 설치해 보는 용)가 Artifacts 로 올라옵니다.
name: Android 앱 빌드

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode (플레이에 올릴 때마다 1씩 올리기: 1, 2, 3 ...)'
        required: true
        default: '1'
      version_name:
        description: 'versionName (이용자에게 보이는 버전, 예: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 웹 게임을 앱으로 복사
        run: |
          npm ci
          npm run sync
      - name: 업로드 키 준비
        env:
          CH_KEYSTORE_B64: ${{ secrets.CH_KEYSTORE_B64 }}
        run: |
          if [ -z "$CH_KEYSTORE_B64" ]; then echo "::warning::CH_KEYSTORE_B64 시크릿이 없어 서명 없이 빌드합니다(플레이 콘솔에는 올릴 수 없음)"; exit 0; fi
          echo "$CH_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "CH_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: AAB·APK 빌드
        working-directory: android-app/android
        env:
          CH_KEYSTORE_PASSWORD: ${{ secrets.CH_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          [ -n "$CH_KEYSTORE_FILE" ] && rm -f "$CH_KEYSTORE_FILE" || true
      - uses: actions/upload-artifact@v4
        with:
          name: canyon-hold-${{ inputs.version_name }}-vc${{ inputs.version_code }}
          path: |
            android-app/android/app/build/outputs/bundle/release/*.aab
            android-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30
